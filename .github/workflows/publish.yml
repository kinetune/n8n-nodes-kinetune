# Publishes the node to npm with a provenance statement when a version tag (5.6.0) is pushed.
# npm trusts this workflow (Trusted Publishers on npmjs.com: kinetune / n8n-nodes-kinetune / publish.yml),
# so there is no token. The source of truth is the Kinetune monorepo, which pushes each release here.
name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      # Lints, builds and publishes with provenance (n8n-node release in CI).
      - run: npm run release
